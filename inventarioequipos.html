<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Inventario de Equipos</title>

<link rel="stylesheet" href="css/estilo.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

#modalImg{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.85);
justify-content:center;
align-items:center;
z-index:999;
}

#modalImg img{
max-width:85%;
max-height:85%;
border-radius:10px;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:6px;
text-align:center;
}

</style>

</head>

<body>

<div class="login">

<h1>Inventario de Equipos</h1>

<h2>Registro</h2>

<label>Número</label>
<input type="text" id="numero" readonly>

<label>Fecha</label>
<input type="date" id="fecha">

<label>Categoría</label>

<select id="categoria" onchange="cargarColores()">

<option value="">Seleccione</option>

<option>BACCIO ORIGINAL</option>

<option>BACCIO DELIZIA</option>

<option>BACCIO VERSA BREW</option>

<option>BACCIO MINI</option>

<option>ESPUMANTE BACCIO</option>

<option>ESPUMANTE BACCIO PICCOLO</option>

<option>BACCIO DUETTO</option>

<option>VASOS BACCIO</option>

<option>MOLINO BACCIO BLUE</option>

</select>

<label>Color</label>

<select id="color">

<option value="">Seleccione una categoría</option>

</select>

<label>Nombre del equipo</label>
<input type="text" id="nombre">

<label>Marca</label>
<input type="text" id="marca">

<label>Modelo</label>
<input type="text" id="modelo">

<label>Número de serie</label>
<input type="text" id="serie">

<label>Responsable</label>
<input type="text" id="responsable">
 
<label>Cantidad</label>

<div style="display:flex; align-items:center; gap:10px;">

<button type="button" onclick="menosCantidad()">➖</button>

<input type="number" id="cantidad" value="1" min="1" style="width:80px; text-align:center;">

<button type="button" onclick="masCantidad()">➕</button>

</div>

<label>Imagen</label>
<input type="file" id="imagen">

<br><br>

<button onclick="guardarEquipo()">💾 Guardar</button>

<button onclick="location.reload()">🔄 Actualizar</button>

<button onclick="location.href='menu.html'">🏠 Menú Principal</button>

<hr>

<h2>Buscar Equipos</h2>

<input
type="text"
id="buscar"
placeholder="Buscar por categoría, modelo, serie, marca o responsable">

<button onclick="filtrar()">🔎 Buscar</button>

<button onclick="cargar()">📋 Ver Todo</button>

<button onclick="generarPDF()">📄 PDF</button>

<hr>

<h2>Inventario de Equipos</h2>

<table id="tablaEquipos" border="1">

<thead>

<tr>

<th>N°</th>

<th>Fecha</th>

<th>Categoría</th>

<th>Color</th>

<th>Equipo</th>

<th>Marca</th>

<th>Modelo</th>

<th>Serie</th>

<th>Responsable</th>

<th>Cantidad</th>

<th>Imagen</th>

<th>Acciones</th>

</tr>

</thead>

<tbody>

</tbody>

</table>

<hr>

<h2>Historial de Equipos</h2>

<select id="buscarHistorial">

<option value="">Todas las categorías</option>

<option>BACCIO ORIGINAL</option>

<option>BACCIO DELIZIA</option>

<option>BACCIO VERSA BREW</option>

<option>BACCIO MINI</option>

<option>ESPUMANTE BACCIO</option>

<option>ESPUMANTE BACCIO PICCOLO</option>

<option>BACCIO DUETTO</option>

<option>VASOS BACCIO</option>

<option>MOLINO BACCIO BLUE</option>

</select>

<button onclick="filtrarHistorial()">🔎 Buscar</button>

<button onclick="cargarHistorial()">📋 Ver Todo</button>

<button onclick="pdfHistorial()">📄 PDF</button>

<table id="tablaHistorial" border="1">

<thead>

<tr>

<th>Fecha y Hora</th>

<th>Movimiento</th>

<th>Categoría</th>

<th>Equipo</th>

<th>Serie</th>

<th>Acción</th>

</tr>

</thead>

<tbody>

</tbody>

</table>

</div>

<div id="modalImg" onclick="cerrarImg()">

<img id="imgGrande">

</div>

<script type="module" src="js/inventarioequipos.js"></script>

</body>

</html>
