<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control de Calidad</title>

<link rel="stylesheet" href="css/estilo.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
/*========== ESTILOS DE BÚSQUEDA ==========*/
.contenedor-busqueda {
    margin: 15px 0;
    display: flex;
    flex-direction: column;
    gap: 5px;
}

.contenedor-busqueda label {
    font-weight: bold;
    color: #333;
}

.contenedor-busqueda input {
    padding: 10px;
    font-size: 14px;
    border: 1px solid #0d6efd;
    border-radius: 6px;
    outline: none;
    transition: box-shadow 0.2s ease;
    width: 100%;
    box-sizing: border-box;
}

.contenedor-busqueda input:focus {
    box-shadow: 0 0 5px rgba(13, 110, 253, 0.5);
}

.tabla-responsive{
    width:100%;
    overflow-x:auto;
    overflow-y:auto;
    max-height:600px;
    border:1px solid #ccc;
    border-radius:10px;
    background:#fff;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
}

#tablaCalidad{
    width:100%;
    min-width:1200px; 
    border-collapse:collapse;
    font-size:14px;
}

#tablaCalidad thead th{
    position:sticky;
    top:0;
    background:#0d6efd;
    color:white;
    padding:10px;
    text-align:center;
    z-index:100;
}

#tablaCalidad td{
    padding:8px;
    text-align:center;
    white-space:nowrap;
}

#tablaCalidad tbody tr:nth-child(even){
    background:#f8f9fa;
}

#tablaCalidad tbody tr:hover{
    background:#dbeafe;
}

#tablaCalidad th,
#tablaCalidad td{
    border:1px solid #ddd;
}

.badge-pt {
    background-color: #198754;
    color: white;
    padding: 3px 6px;
    border-radius: 4px;
    font-size: 12px;
    font-weight: bold;
    display: inline-block;
}
</style>
</head>

<body>

<div class="login">

<h1>Control de Calidad</h1>

<label for="lote">Lote (Producción)</label>
<select id="lote">
    <option value="">Cargando lotes...</option>
</select>

<label for="lotePT">Ingrese Lote de Producto Terminado</label>
<input type="text" id="lotePT" placeholder="Ej: LOTE-PT-2026-01">

<label for="producto">Producto</label>
<input type="text" id="producto" placeholder="Producto" readonly>

<label for="fecha">Fecha y Hora de Control</label>
<input type="datetime-local" id="fecha">

<label for="capsulas">Cápsulas en control</label>
<input type="number" id="capsulas" placeholder="Cápsulas en control">

<label for="desechos">Desechos</label>
<input type="number" id="desechos" placeholder="Desechos">

<label for="defecto">Defectos</label>
<input type="number" id="defecto" placeholder="Defectos">

<label for="total">Total aprobado</label>
<input type="number" id="total" placeholder="Total (auto)" readonly>

<label for="disponible">Cápsulas producidas disponibles</label>
<input type="number" id="disponible" placeholder="Capsulas producidas" readonly>

<button type="button" onclick="guardarCalidad()">Guardar</button>

<br><br>

<button type="button" onclick="location.href='menu.html'">Volver</button>
<button type="button" onclick="location.reload()">🔄 Actualizar</button>

<hr>

<h2>Registros de Control de Calidad</h2>

<!-- BARRA DE BÚSQUEDA Y BOTÓN -->
<div class="contenedor-busqueda">
    <label for="buscarLoteCalidad">🔎 Buscar en Control de Calidad:</label>
    <div style="display: flex; gap: 8px; width: 100%; max-width: 500px;">
        <input type="text" id="buscarLoteCalidad" placeholder="Escriba lote, producto, fecha o cantidad...">
        <button id="btnBuscarCalidad" type="button" style="padding: 8px 16px; background-color: #0d6efd; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;">Buscar</button>
    </div>
</div>

<div class="tabla-responsive">
    <table id="tablaCalidad">
        <thead>
            <tr>
                <th>Lote / Producto</th>
                <th>Lote Producto Terminado</th>
                <th>Fecha y Hora</th>
                <th>Cápsulas Control</th>
                <th>Desechos</th>
                <th>Defectos</th>
                <th>Total Neto Aprobado</th>
                <th>Acciones</th>
                <th>PDF</th>
            </tr>
        </thead>
        <tbody id="tbodyCalidad"></tbody>
    </table>
</div>

</div>

<div style="background:#0d6efd;color:white;padding:15px;text-align:center;font-size:22px;font-weight:bold;">
     SISTEMA DE CALIDAD
</div>

<script type="module" src="js/calidad.js" defer></script>

</body>
</html>
