<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Empaque Café en Grano</title>

    <link rel="stylesheet" href="css/estilo.css">

    <!-- Librería para generar reportes PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        /*========== TARJETA / CUADRO RESUMEN MATERIA PRIMA ==========*/
        .cuadro-gavetas {
            background: #e7f1ff;
            border: 2px solid #0d6efd;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(13, 110, 253, 0.15);
        }

        .cuadro-gavetas h3 {
            margin: 0 0 10px 0;
            color: #0d6efd;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 18px;
        }

        .cuadro-gavetas .total-destacado {
            font-size: 24px;
            font-weight: bold;
            color: #0b5ed7;
            margin-bottom: 10px;
        }

        .cuadro-gavetas ul {
            margin: 0;
            padding-left: 20px;
            color: #333;
        }

        .cuadro-gavetas li {
            margin-bottom: 4px;
        }

        /*========== CONTENEDORES DINÁMICOS / OCULTOS ==========*/
        .campo-oculto {
            display: none;
        }

        /*========== ESTILOS DE BÚSQUEDA ==========*/
        .contenedor-busqueda {
            margin: 15px 0;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .contenedor-busqueda label {
            font-weight: bold;
            color: #333;
        }

        .contenedor-busqueda input {
            padding: 10px;
            font-size: 14px;
            border: 1px solid #0d6efd;
            border-radius: 6px;
            outline: none;
            transition: box-shadow 0.2s ease;
            width: 100%;
            box-sizing: border-box;
        }

        .contenedor-busqueda input:focus {
            box-shadow: 0 0 5px rgba(13, 110, 253, 0.5);
        }

        /*========== ESTILOS DE TABLA RESPONSIVA ==========*/
        .tabla-responsive {
            width: 100%;
            overflow-x: auto;
            overflow-y: auto;
            max-height: 600px;
            border: 1px solid #ccc;
            border-radius: 10px;
            background: #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,.15);
        }

        #tablaEmpaqueGrano {
            width: 100%;
            min-width: 1200px; 
            border-collapse: collapse;
            font-size: 14px;
        }

        #tablaEmpaqueGrano thead th {
            position: sticky;
            top: 0;
            background: #0d6efd;
            color: white;
            padding: 10px;
            text-align: center;
            z-index: 100;
        }

        #tablaEmpaqueGrano td {
            padding: 8px;
            text-align: center;
            white-space: nowrap;
        }

        #tablaEmpaqueGrano tbody tr:nth-child(even) {
            background: #f8f9fa;
        }

        #tablaEmpaqueGrano tbody tr:hover {
            background: #dbeafe;
        }

        #tablaEmpaqueGrano th,
        #tablaEmpaqueGrano td {
            border: 1px solid #ddd;
        }
    </style>
</head>

<body>

    <div class="login">

        <h1>Empaque de Café en Grano</h1>

        <!-- CUADRO UNIFICADO: STOCK DISPONIBLE EN MATERIA PRIMA -->
        <div id="cuadroMateriaPrimaDisponible" class="cuadro-gavetas">
            <h3>☕ Café Disponible en Materia Prima</h3>
            <div class="total-destacado">Cargando...</div>
            <ul id="listaMateriaPrimaDetalle"></ul>
        </div>

        <!-- FORMULARIO DE REGISTRO DE EMPAQUE -->
        <label for="fechaRegistroManual">Fecha de Registro</label>
        <input type="date" id="fechaRegistroManual">

        <label for="lote">Seleccionar Lote (Materia Prima)</label>
        <select id="lote">
            <option value="">Cargando lotes...</option>
        </select>

        <label for="tipoPresentacion">Tipo de Presentación / Destino</label>
        <select id="tipoPresentacion">
            <option value="estandar_200g">Bolsa Estándar (200g)</option>
            <option value="personalizado">🛠 Personalizado (Bolsa o Caja / Gramos a elección)</option>
            <option value="degustacion">☕ Degustación / Muestra / Uso Interno</option>
        </select>

        <!-- OPCIONES ADICIONALES PARA PERSONALIZADO -->
        <div id="secPersonalizado" class="campo-oculto">
            <label for="tipoEmpaquePersonalizado">Tipo de Empaque</label>
            <select id="tipoEmpaquePersonalizado">
                <option value="Bolsa">Bolsa</option>
                <option value="Caja">Caja</option>
            </select>

            <label for="gramosPorUnidadPersonalizado">Gramos por unidad (g)</label>
            <input type="number" id="gramosPorUnidadPersonalizado" placeholder="Ej. 250, 500, 1000...">
        </div>

        <label for="nombreOperario">Nombre del Producto / Operario</label>
        <input type="text" id="nombreOperario" placeholder="Ej. Café Premium, Muestra Evento...">

        <label for="cantidadUnidades" id="lblCantidadUnidades">Cantidad de Unidades</label>
        <input type="number" id="cantidadUnidades" placeholder="Cantidad de empaques o muestras">

        <label for="totalGramos">Total gramos consumidos</label>
        <input type="text" id="totalGramos" readonly placeholder="0 g">

        <label for="totalKilos">Total kilos a descontar de Materia Prima</label>
        <input type="text" id="totalKilos" readonly placeholder="0.00 kg">

        <button onclick="guardarEmpaqueGrano()">Guardar Registro</button>

        <br><br>

        <button onclick="location.href='menu.html'">Volver</button>
        <button onclick="location.reload()">🔄 Actualizar</button>

        <hr>

        <h2>Registros de Empaque</h2>

        <!-- BARRA DE BÚSQUEDA Y BOTÓN BUSCAR -->
        <div class="contenedor-busqueda">
            <label for="buscarLoteEmpaque">🔎 Buscar en Registros de Empaque:</label>
            <div style="display: flex; gap: 8px; width: 100%; max-width: 500px;">
                <input type="text" id="buscarLoteEmpaque" placeholder="Escriba lote, tipo, producto o fecha...">
                <button id="btnBuscarEmpaque" type="button" style="padding: 8px 16px; background-color: #0d6efd; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;">Buscar</button>
            </div>
        </div>

        <!-- TABLA RESPONSIVA DE REGISTROS -->
        <div class="tabla-responsive">
            <table id="tablaEmpaqueGrano">
                <thead>
                    <tr>
                        <th>Fecha Registro</th>
                        <th>Lote Origen</th>
                        <th>Presentación / Empaque</th>
                        <th>Producto / Operario</th>
                        <th>Unidades Iniciales</th>
                        <th>Total Gramos</th>
                        <th>Total Kilos (kg)</th>
                        <th>Estado / Stock</th>
                        <th>Acciones</th>
                        <th>PDF</th>
                    </tr>
                </thead>
                <tbody id="tbodyEmpaqueGrano">
                    <!-- Se llena dinámicamente con JS -->
                </tbody>
            </table>
        </div>

    </div>

    <script type="module" src="js/empaque_cafe_grano.js"></script>

</body>
</html>
