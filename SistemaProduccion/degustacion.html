<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cápsulas para Degustación</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Cargar jsPDF para exportar reportes en PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body class="bg-light p-4">

    <div class="container-fluid">
        <!-- Título -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>☕ Módulo de Cápsulas para Degustación</h2>
        </div>

        <!-- Resumen de Gavetas / Cápsulas Disponibles -->
        <div class="card mb-4 border-primary">
            <div class="card-header bg-primary text-white font-weight-bold">
                📊 Stock Total Disponible para Degustación
            </div>
            <div class="card-body">
                <h4 id="totalGavetasDegustacion" class="card-title text-primary fw-bold">Cargando...</h4>
                <ul id="listaGavetasDegustacion" class="mt-3 mb-0">
                    <!-- Contenido dinámico con la disponibilidad por producto -->
                </ul>
            </div>
        </div>

        <!-- Formulario de Registro -->
        <div class="card mb-4 shadow-sm">
            <div class="card-header bg-white fw-bold">
                📝 Registrar Salida de Cápsulas
            </div>
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-3">
                        <label for="fechaHora" class="form-label">Fecha y Hora *</label>
                        <input type="datetime-local" class="form-control" id="fechaHora" required>
                    </div>

                    <div class="col-md-5">
                        <label for="lote" class="form-label">Seleccionar Lote de Producción *</label>
                        <select class="form-select" id="lote">
                            <option value="">Seleccione lote...</option>
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label for="producto" class="form-label">Producto</label>
                        <input type="text" class="form-control bg-light" id="producto" placeholder="Nombre del producto" readonly>
                    </div>

                    <div class="col-md-3">
                        <label for="disponible" class="form-label">Stock Disponible</label>
                        <input type="number" class="form-control bg-light" id="disponible" readonly>
                    </div>

                    <div class="col-md-3">
                        <label for="cantidadDegustacion" class="form-label">Cantidad a Entregar *</label>
                        <input type="number" class="form-control" id="cantidadDegustacion" placeholder="Ej: 10" min="1">
                    </div>

                    <div class="col-md-6">
                        <label for="responsable" class="form-label">Responsable / Entregado a</label>
                        <input type="text" class="form-control" id="responsable" placeholder="Ej: Juan Pérez (Marketing)">
                    </div>

                    <div class="col-md-12">
                        <label for="observaciones" class="form-label">Observaciones</label>
                        <input type="text" class="form-control" id="observaciones" placeholder="Ej: Degustación para evento corporativo">
                    </div>

                    <div class="col-12 text-end mt-4">
                        <button type="button" class="btn btn-success px-4" onclick="guardarDegustacion()">
                            💾 Guardar Registro
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Filtro de Búsqueda e Historial -->
        <div class="card shadow-sm">
            <div class="card-header bg-white d-flex justify-content-between align-items-center fw-bold">
                <span>📋 Historial de Salidas para Degustación</span>
                <div class="d-flex" style="max-width: 350px;">
                    <input type="text" id="buscarDegustacion" class="form-control form-control-sm me-2" placeholder="Buscar por lote, producto o responsable...">
                    <button class="btn btn-sm btn-outline-secondary" id="btnBuscarDegustacion">Buscar</button>
                </div>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0" id="tablaDegustacion">
                        <thead class="table-dark">
                            <tr>
                                <th>Fecha y Hora</th>
                                <th>Lote / Producto</th>
                                <th>Cantidad</th>
                                <th>Responsable</th>
                                <th>Observaciones</th>
                                <th>Acciones</th>
                                <th>PDF</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Los registros cargados con JS aparecerán aquí -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Cargar el módulo JavaScript -->
    <script type="module" src="degustacion.js"></script>
</body>
</html>
