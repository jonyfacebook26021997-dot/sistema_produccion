<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Inventario Accesorios</title>

<link rel="stylesheet" href="css/estilo.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

#modalImg{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.8);
justify-content:center;
align-items:center;
z-index:999;
}

#modalImg img{
max-width:85%;
max-height:85%;
border-radius:10px;
}

</style>

</head>

<body>

<div class="login">

<h1>Inventario de Accesorios y Repuestos</h1>

<h2>Registro</h2>

<label>Número</label>
<input type="text" id="numero" readonly>

<label>Fecha</label>
<input type="date" id="fecha">

<label>Categoría</label>

<select id="categoria">

<option value="">Seleccione</option>

<option>BACCIO ORIGINAL</option>

<option>BACCIO DELIZIA</option>

<option>BACCIO VERSA BREW</option>

<option>BACCIO MINI</option>

<option>ESPUMANTES</option>

</select>

<div>Descripción</label>
<input type="text" id="descripcion">

<label>Código</label>
<input type="text" id="codigo">

<label>Cantidad</label>
<input type="number" id="cantidad">

<label>Imagen</label>
<input type="file" id="imagen">

<br><br>

<button onclick="guardarAccesorio()">💾 Guardar</button>

<button onclick="location.reload()">🔄 Actualizar</button>

<hr>

<h2>Buscar Inventario</h2>

<input
type="text"
id="buscar"
placeholder="Buscar por categoría, descripción o código">

<button onclick="filtrar()">🔍 Buscar</button>

<button onclick="generarPDF()">📄 PDF</button>

<button onclick="cargar()">📋 Ver todo</button>

<button onclick="cargarHistorial()">📑 Historial</button>


<hr>

<h2>Inventario Actual</h2>

<table
id="tablaAccesorios"
border="1"
width="100%">

<thead>

<tr>

<th>N°</th>

<th>Fecha</th>

<th>Categoría</th>

<th>Descripción</th>

<th>Código</th>

<th>Cantidad</th>

<th>Imagen</th>

<th>Acciones</th>

</tr>

</thead>

<tbody></tbody>

</table>

<hr>

<h2>Historial de Entradas y Salidas</h2>

<label>Categoría</label>

<select id="buscarHistorial">
    <option value="">Todas las categorías</option>
    <option>BACCIO ORIGINAL</option>
    <option>BACCIO DELIZIA</option>
    <option>BACCIO VERSA BREW</option>
    <option>BACCIO MINI</option>
    <option>ESPUMANTES</option>
</select>

<br><br>

<button onclick="filtrarHistorial()">🔎 Buscar</button>

<button onclick="cargarHistorial()">📋 Ver Todo</button>

<button onclick="pdfHistorial()">📄 PDF Historial</button>

<hr>

<table id="tablaHistorial" border="1" width="100%">

<thead>

<tr>

<th>Fecha y Hora</th>

<th>Movimiento</th>

<th>Categoría</th>

<th>Descripción</th>

<th>Código</th>

<th>Cantidad</th>

<th>Acciones</th>

</tr>

</thead>

<tbody>

</tbody>

</table>


<script type="module" src="js/inventarioaccesorios.js"></script>

</body>

</html>
