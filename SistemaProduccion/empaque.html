<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Empaque</title>

<link rel="stylesheet" href="css/estilo.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
/*========== TARJETA / CUADRO RESUMEN GAVETAS ==========*/
.cuadro-gavetas {
    background: #e7f1ff;
    border: 2px solid #0d6efd;
    border-radius: 10px;
    padding: 15px;
    margin-bottom: 20px;
    box-shadow: 0 4px 10px rgba(13, 110, 253, 0.15);
}

.cuadro-gavetas h3 {
    margin: 0 0 10px 0;
    color: #0d6efd;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 18px;
}

.cuadro-gavetas .total-destacado {
    font-size: 24px;
    font-weight: bold;
    color: #0b5ed7;
    margin-bottom: 10px;
}

.cuadro-gavetas ul {
    margin: 0;
    padding-left: 20px;
    color: #333;
}

.cuadro-gavetas li {
    margin-bottom: 4px;
}

/*========== ESTILOS DE BÚSQUEDA ==========*/
.contenedor-busqueda {
    margin: 15px 0;
    display: flex;
    flex-direction: column;
    gap: 5px;
}

.contenedor-busqueda label {
    font-weight: bold;
    color: #333;
}

.contenedor-busqueda input {
    padding: 10px;
    font-size: 14px;
    border: 1px solid #0d6efd;
    border-radius: 6px;
    outline: none;
    transition: box-shadow 0.2s ease;
    width: 100%;
    box-sizing: border-box;
}

.contenedor-busqueda input:focus {
    box-shadow: 0 0 5px rgba(13, 110, 253, 0.5);
}

/*========== ESTILOS DE TABLA RESPONSIVA ==========*/
.tabla-responsive {
    width: 100%;
    overflow-x: auto;
    overflow-y: auto;
    max-height: 600px;
    border: 1px solid #ccc;
    border-radius: 10px;
    background: #fff;
    box-shadow: 0 2px 8px rgba(0,0,0,.15);
}

#tablaEmpaque {
    width: 100%;
    min-width: 1200px; 
    border-collapse: collapse;
    font-size: 14px;
}

#tablaEmpaque thead th {
    position: sticky;
    top: 0;
    background: #0d6efd;
    color: white;
    padding: 10px;
    text-align: center;
    z-index: 100;
}

#tablaEmpaque td {
    padding: 8px;
    text-align: center;
    white-space: nowrap;
}

#tablaEmpaque tbody tr:nth-child(even) {
    background: #f8f9fa;
}

#tablaEmpaque tbody tr:hover {
    background: #dbeafe;
}

#tablaEmpaque th,
#tablaEmpaque td {
    border: 1px solid #ddd;
}
</style>
</head>

<body>

<div class="login">

<h1>Empaque</h1>

<!-- CUADRO UNIFICADO: CÁPSULAS EN GAVETAS DISPONIBLES -->
<div id="cuadroGavetasDisponibles" class="cuadro-gavetas">
    <h3>📥 Cápsulas Disponibles en Gavetas</h3>
    <div class="total-destacado">Cargando...</div>
    <ul id="listaGavetasDetalle"></ul>
</div>

<!-- FORMULARIO DE REGISTRO DE EMPAQUE -->
<label>Fecha y Hora de Empaque</label>
<input type="datetime-local" id="fechaHora">

<label>Seleccionar Lote de Producción</label>
<select id="lote">
    <option value="">Cargando lotes...</option>
</select>

<label>Tipo de Empaque</label>
<select id="tipo">
    <option value="10">Caja x10 cápsulas</option>
    <option value="3">Caja x3 cápsulas</option>
    <option value="15">Bolsa x15 cápsulas</option>
    <option value="degustacion">Degustación</option>
    <option value="custom">Personalizado</option>
</select>

<!-- OPCIONES ADICIONALES PARA EMPAQUE PERSONALIZADO -->
<select id="tipoContenedorCustom" style="display:none;">
    <option value="bolsa">Bolsa</option>
    <option value="caja">Caja</option>
</select>

<input type="number" id="personalizado" placeholder="Unidades por empaque" style="display:none;">

<label id="lblCantidadEmpacar">Cantidad de empaques (Cajas/Bolsas)</label>
<input type="number" id="cantidadEmpacar" placeholder="Cantidad de empaques">

<label>Cápsulas Disponibles Restantes (Cálculo automático)</label>
<input type="number" id="disponible" placeholder="Capsulas disponibles" readonly>

<button onclick="guardarEmpaque()">Guardar</button>

<br><br>

<button onclick="location.href='menu.html'">Volver</button>
<button onclick="location.reload()">🔄 Actualizar</button>

<hr>

<h2>Registros de Empaque</h2>

<!-- BARRA DE BÚSQUEDA Y BOTÓN BUSCAR -->
<div class="contenedor-busqueda">
    <label for="buscarLoteEmpaque">🔎 Buscar en Registros de Empaque:</label>
    <div style="display: flex; gap: 8px; width: 100%; max-width: 500px;">
        <input type="text" id="buscarLoteEmpaque" placeholder="Escriba cualquier palabra, lote, producto o fecha...">
        <button id="btnBuscarEmpaque" type="button" style="padding: 8px 16px; background-color: #0d6efd; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;">Buscar</button>
    </div>
</div>

<!-- TABLA RESPONSIVA DE REGISTROS -->
<div class="tabla-responsive">
    <table id="tablaEmpaque">
        <thead>
            <tr>
                <th>Fecha y Hora</th>
                <th>Lote / Producto</th>
                <th>Tipo de Empaque</th>
                <th>Cantidad Empaques</th>
                <th>Restante Neto</th>
                <th>Acciones</th>
                <th>PDF</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

</div>

<script type="module" src="js/empaque.js"></script>

</body>
</html>
