<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Producción</title>

<link rel="stylesheet" href="css/estilo.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
/*========== TABLA RESPONSIVA ==========*/
.tabla-responsive{
    width:100%;
    overflow-x:auto;
    overflow-y:auto;
    max-height:600px;
    border:1px solid #ccc;
    border-radius:10px;
    background:#fff;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
}

#tablaProduccion{
    width:100%;
    min-width:1750px; /* Ajustado para dar espacio a los campos editables */
    border-collapse:collapse;
    font-size:14px;
}

#tablaProduccion thead th{
    position:sticky;
    top:0;
    background:#0d6efd;
    color:white;
    padding:10px;
    text-align:center;
    z-index:100;
}

#tablaProduccion td{
    padding:8px;
    text-align:center;
    white-space:nowrap;
}

#tablaProduccion tbody tr:nth-child(even){
    background:#f8f9fa;
}

#tablaProduccion tbody tr:hover{
    background:#dbeafe;
}

#tablaProduccion th,
#tablaProduccion td{
    border:1px solid #ddd;
}

/* Scroll bonito */
.tabla-responsive::-webkit-scrollbar{
    height:12px;
}
.tabla-responsive::-webkit-scrollbar-track{
    background:#e9ecef;
}
.tabla-responsive::-webkit-scrollbar-thumb{
    background:#0d6efd;
    border-radius:20px;
}
</style>
</head>

<body>

<div class="login">

<h1>Producción</h1>

<label>Fecha y hora de inicio de producción</label>
<input type="datetime-local" id="fechaInicio">

<label>Fecha de fin de producción</label>
<input type="datetime-local" id="fechaFin">

<label>Lote disponible (Materia Prima)</label>
<select id="lote">
    <option value="">Cargando lotes...</option>
</select>

<label>Producto</label>
<input type="text" id="producto" placeholder="Producto">

<label>Total café en grano (kg)</label>
<input type="number" id="cafe" placeholder="Total café en grano">

<label>Punto de molienda</label>
<input type="number" id="molienda" placeholder="Punto de molienda">

<label>Arranque máquina</label>
<input type="number" id="arranque" placeholder="Arranque máquina">

<label>Arranque final máquina</label>
<input type="number" id="final" placeholder="Arranque final máquina">

<label>Total cápsulas</label>
<input type="number" id="capsulas" placeholder="Total cápsulas">

<label>Desechos</label>
<input type="number" id="desechos" placeholder="Desechos">

<label>Total neto</label>
<input type="number" id="neto" placeholder="Total neto" readonly>

<button onclick="guardarProduccion()">Guardar</button>

<br><br>

<button onclick="location.href='menu.html'">Volver</button>
<button onclick="location.reload()">🔄 Actualizar</button>

<hr>

<h2>BUSCAR HISTORIAL</h2>
<div style="display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:20px;">
    <div>
        <label>Desde</label><br>
        <input type="date" id="buscarDesde">
    </div>
    <div>
        <label>Hasta</label><br>
        <input type="date" id="buscarHasta">
    </div>
    <div>
        <label>Lote</label><br>
        <input type="text" id="buscarLote" placeholder="Lote interno">
    </div>
    <div>
        <label>Producto</label><br>
        <input type="text" id="buscarProducto" placeholder="Producto">
    </div>
    <div>
        <button onclick="buscarProduccion()">🔍 Buscar</button>
    </div>
    <div>
        <button onclick="cargarProduccion()">📋 Mostrar todos</button>
    </div>
</div>

<h3 id="totalRegistros">Total registros: 0</h3>

<hr>

<h2>Registros</h2>
<div class="tabla-responsive">
    <table id="tablaProduccion">
        <thead>
            <tr>
                <th>Fecha Inicio Producción</th>
                <th>Fecha Fin Producción</th>
                <th>Lote</th>
                <th>Producto</th>
                <th>Café (kg)</th>
                <th>Molienda</th>
                <th>Arranque</th>
                <th>Final</th>
                <th>Cápsulas</th>
                <th>Desechos</th>
                <th>Neto</th>
                <th>Acciones</th>
                <th>PDF</th>
            </tr>
        </thead>
        <tbody id="tbodyProduccion">
        </tbody>
    </table>
</div>

</div>

<div style="background:#0d6efd;color:white;padding:15px;text-align:center;font-size:22px;font-weight:bold;">
     SISTEMA DE PRODUCCIÓN
</div>

<script type="module" src="js/produccion.js"></script>

</body>
</html>
