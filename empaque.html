<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Empaque</title>

<link rel="stylesheet" href="css/estilo.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
/* ========== ESTILOS DEL ENCABEZADO OFICIAL CON CONTROL DE EDICIÓN ========== */
.contenedor-encabezado-wrapper {
    position: relative;
    margin-bottom: 25px;
}

.tabla-encabezado-oficial {
    display: flex;
    width: 100%;
    border: 2px solid #333;
    font-family: Arial, sans-serif;
    background: #fff;
    box-sizing: border-box;
}

.encabezado-logo {
    flex: 1.2;
    border-right: 2px solid #333;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px;
    background: #fff;
}

.encabezado-logo img {
    max-width: 100%;
    max-height: 60px;
    object-fit: contain;
}

.encabezado-titulo {
    flex: 2.8;
    border-right: 2px solid #333;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 15px;
    text-align: center;
    background: #fff;
}

.encabezado-datos {
    flex: 1.5;
    display: flex;
    flex-direction: column;
    font-size: 15px;
}

.fila-dato {
    display: flex;
    border-bottom: 1px solid #333;
    flex: 1;
}

.fila-dato:last-child {
    border-bottom: none;
}

.etiqueta-campo {
    flex: 1;
    border-right: 1px solid #333;
    padding: 8px 10px;
    font-weight: bold;
    background: #f1f1f1;
    display: flex;
    align-items: center;
    font-size: 14px;
}

.valor-campo {
    flex: 1;
    padding: 8px 10px;
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    font-weight: bold;
}

.input-edicion-encabezado {
    width: 95%;
    padding: 5px;
    font-size: 14px;
    font-weight: bold;
    text-align: center;
    border: 2px solid #0d6efd;
    border-radius: 4px;
    background-color: #fff9db;
    color: #000;
    box-sizing: border-box;
}

.controles-encabezado {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 8px;
    margin-top: 8px;
}

/*========== TARJETA / CUADRO RESUMEN GAVETAS ==========*/
.cuadro-gavetas {
    background: #e7f1ff;
    border: 2px solid #0d6efd;
    border-radius: 10px;
    padding: 15px;
    margin-bottom: 20px;
    box-shadow: 0 4px 10px rgba(13, 110, 253, 0.15);
}

.cuadro-gavetas h3 {
    margin: 0 0 10px 0;
    color: #0d6efd;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 18px;
}

.cuadro-gavetas .total-destacado {
    font-size: 24px;
    font-weight: bold;
    color: #0b5ed7;
    margin-bottom: 10px;
}

.cuadro-gavetas ul {
    margin: 0;
    padding-left: 20px;
    color: #333;
}

.cuadro-gavetas li {
    margin-bottom: 4px;
}

/*========== PANEL DE RESUMEN ESPECÍFICO DEL LOTE SELECCIONADO ==========*/
.panel-resumen-lote {
    background: #f8f9fa;
    border: 2px dashed #198754;
    border-radius: 10px;
    padding: 15px;
    margin: 15px 0 20px 0;
    display: none;
}

.panel-resumen-lote h4 {
    margin: 0 0 8px 0;
    color: #198754;
    font-size: 16px;
}

.panel-resumen-lote p {
    margin: 4px 0;
    font-size: 14px;
    color: #333;
}

/*========== ESTILOS DE BÚSQUEDA ==========*/
.contenedor-busqueda {
    margin: 15px 0;
    display: flex;
    flex-direction: column;
    gap: 5px;
}

.contenedor-busqueda label {
    font-weight: bold;
    color: #333;
}

.contenedor-busqueda input {
    padding: 10px;
    font-size: 14px;
    border: 1px solid #0d6efd;
    border-radius: 6px;
    outline: none;
    transition: box-shadow 0.2s ease;
    width: 100%;
    box-sizing: border-box;
}

.contenedor-busqueda input:focus {
    box-shadow: 0 0 5px rgba(13, 110, 253, 0.5);
}

/*========== ESTILOS DE TABLA RESPONSIVA ==========*/
.tabla-responsive {
    width: 100%;
    overflow-x: auto;
    overflow-y: auto;
    max-height: 600px;
    border: 1px solid #ccc;
    border-radius: 10px;
    background: #fff;
    box-shadow: 0 2px 8px rgba(0,0,0,.15);
}

#tablaEmpaque {
    width: 100%;
    min-width: 1200px; 
    border-collapse: collapse;
    font-size: 14px;
}

#tablaEmpaque thead th {
    position: sticky;
    top: 0;
    background: #0d6efd;
    color: white;
    padding: 10px;
    text-align: center;
    z-index: 100;
}

#tablaEmpaque td {
    padding: 8px;
    text-align: center;
    white-space: nowrap;
}

#tablaEmpaque tbody tr:nth-child(even) {
    background: #f8f9fa;
}

#tablaEmpaque tbody tr:hover {
    background: #dbeafe;
}

#tablaEmpaque th,
#tablaEmpaque td {
    border: 1px solid #ddd;
}
</style>
</head>

<body>

<div class="login">

<!-- ENCABEZADO OFICIAL CON BOTÓN "EDITAR ENCABEZADO" Y "GUARDAR" -->
<div class="contenedor-encabezado-wrapper">
    <div id="encabezadoParaPdf" class="tabla-encabezado-oficial">
        <div class="encabezado-logo">
            <img src="img/logo.png" alt="LAT-ZERO coffee">
        </div>
        <div class="encabezado-titulo">
            <h3 id="pdfTitulo" style="margin: 0; font-size: 18px; font-weight: bold; color: #000; width: 100%; text-align: center;">
                REGISTRO Y CONTROL DE EMPAQUE
            </h3>
            <input type="text" id="inputPdfTitulo" class="input-edicion-encabezado" style="display: none; font-size: 16px;" value="REGISTRO Y CONTROL DE EMPAQUE">
        </div>
        <div class="encabezado-datos">
            <div class="fila-dato">
                <span class="etiqueta-campo">Código:</span>
                <div class="valor-campo">
                    <span id="pdfCodigo">REGP11</span>
                    <input type="text" id="inputPdfCodigo" class="input-edicion-encabezado" style="display: none;" value="REGP11">
                </div>
            </div>
            <div class="fila-dato">
                <span class="etiqueta-campo">Versión:</span>
                <div class="valor-campo">
                    <span id="pdfVersion">001</span>
                    <input type="text" id="inputPdfVersion" class="input-edicion-encabezado" style="display: none;" value="001">
                </div>
            </div>
            <div class="fila-dato">
                <span class="etiqueta-campo">Elaboración:</span>
                <div class="valor-campo">
                    <span id="pdfElaboracion">01/02/2024</span>
                    <input type="text" id="inputPdfElaboracion" class="input-edicion-encabezado" style="display: none;" value="01/02/2024">
                </div>
            </div>
        </div>
    </div>

    <!-- Botones de control del encabezado -->
    <div class="controles-encabezado">
        <button type="button" id="btnEditarEncabezado" onclick="activarEdicionEncabezado()" style="background-color: #0d6efd; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; width: auto;">
            ✏️ Editar encabezado
        </button>

        <div id="grupoGuardarEncabezado" style="display: none; gap: 8px; align-items: center;">
            <span style="font-size: 13px; color: #856404; font-weight: bold;">Editando:</span>
            <button type="button" onclick="guardarEncabezado()" style="background-color: #198754; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; width: auto;">
                💾 Guardar
            </button>
            <button type="button" onclick="cancelarEdicionEncabezado()" style="background-color: #6c757d; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 13px; width: auto;">
                ❌ Cancelar
            </button>
        </div>
    </div>
</div>
<!-- FIN DEL ENCABEZADO -->

<h1>Empaque</h1>

<!-- CUADRO UNIFICADO: CÁPSULAS EN GAVETAS DISPONIBLES -->
<div id="cuadroGavetasDisponibles" class="cuadro-gavetas">
    <h3>📥 Cápsulas Disponibles en Gavetas</h3>
    <div class="total-destacado">Cargando...</div>
    <ul id="listaGavetasDetalle"></ul>
</div>

<!-- FORMULARIO DE REGISTRO DE EMPAQUE -->
<label>Fecha y Hora de Empaque</label>
<input type="datetime-local" id="fechaHora">

<label>Seleccionar Lote de Producción</label>
<select id="lote">
    <option value="">Cargando lotes...</option>
</select>

<label>Tipo de Empaque</label>
<select id="tipo">
    <option value="10">Caja x10 cápsulas</option>
    <option value="3">Caja x3 cápsulas</option>
    <option value="15">Bolsa x15 cápsulas</option>
    <option value="degustacion">Degustación</option>
    <option value="custom">Personalizado</option>
</select>

<!-- OPCIONES ADICIONALES PARA EMPAQUE PERSONALIZADO -->
<select id="tipoContenedorCustom" style="display:none;">
    <option value="bolsa">Bolsa</option>
    <option value="caja">Caja</option>
</select>

<input type="number" id="personalizado" placeholder="Unidades por empaque" style="display:none;">

<label id="lblCantidadEmpacar">Cantidad de empaques (Cajas/Bolsas)</label>
<input type="number" id="cantidadEmpacar" placeholder="Cantidad de empaques">

<label>Cápsulas Disponibles Restantes (Cálculo automático)</label>
<input type="number" id="disponible" placeholder="Capsulas disponibles" readonly>

<button onclick="guardarEmpaque()">💾 Guardar</button>

<br><br>

<!-- BOTONES PRINCIPALES Y BUSCADOR/SELECTOR DE LOTE PARA PDF CONSOLIDADO -->
<div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
    <button onclick="location.href='menu.html'">🏠 Volver</button>
    <button onclick="location.reload()">🔄 Actualizar</button>

    <!-- Campo de texto con autocompletado (datalist) para escribir/seleccionar lote y exportar PDF -->
    <div style="display: flex; gap: 5px; align-items: center; margin-left: 10px; background: #f8f9fa; padding: 6px; border: 1px solid #ccc; border-radius: 6px;">
        <input list="listaLotesPdf" id="inputPdfLoteEmpaque" placeholder="Escriba o seleccione lote..." style="padding: 8px; border-radius: 4px; border: 1px solid #ccc; width: 280px; font-size: 14px;">
        <datalist id="listaLotesPdf">
            <!-- Se llena dinámicamente desde JavaScript -->
        </datalist>
        <button type="button" onclick="exportarPdfLoteCompleto()" style="background-color: #dc3545; color: white; padding: 8px 14px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">📄 Exportar PDF</button>
    </div>
</div>

<hr>

<h2>Registros de Empaque</h2>

<!-- BARRA DE BÚSQUEDA Y BOTÓN BUSCAR -->
<div class="contenedor-busqueda">
    <label for="buscarLoteEmpaque">🔎 Buscar en Registros de Empaque:</label>
    <div style="display: flex; gap: 8px; width: 100%; max-width: 500px;">
        <input type="text" id="buscarLoteEmpaque" placeholder="Escriba cualquier palabra, lote, producto o fecha...">
        <button id="btnBuscarEmpaque" type="button" style="padding: 8px 16px; background-color: #0d6efd; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;">Buscar</button>
    </div>
</div>

<!-- TABLA RESPONSIVA DE REGISTROS -->
<div class="tabla-responsive">
    <table id="tablaEmpaque">
        <thead>
            <tr>
                <th>Fecha y Hora</th>
                <th>Lote / Producto</th>
                <th>Tipo de Empaque</th>
                <th>Cantidad Empaques</th>
                <th>Restante Neto</th>
                <th>Acciones</th>
                <th>PDF</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

</div>

<script type="module" src="js/empaque.js"></script>

</body>
</html>
